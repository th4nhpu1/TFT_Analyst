services:
  db:
    image: postgres:15
    container_name: Tft_db
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  dbt:
    image: tft-analyst-pipeline:local
    build: ./airflow
    entrypoint: ["/opt/dbt-venv/bin/dbt"]
    command: ["run", "--project-dir", "/app", "--profiles-dir", "/app"]
    working_dir: /app
    volumes:
      - ./transform/dbt:/app
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  server:
    image: tft-analyst-app:local
    build: ./extract
    ports:
      - "8501:8501"
    volumes:
      - ./extract:/app
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      dbt:
        condition: service_completed_successfully

  ingest:
    profiles: [manual]
    image: tft-analyst-app:local
    build: ./extract
    command: ["python", "loadData.py", "--db-host", "db"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RIOT_API_KEY: ${RIOT_API_KEY}
    depends_on:
      db:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy

  airflow:
    profiles: [scheduler]
    image: tft-analyst-pipeline:local
    build: ./airflow
    command: standalone
    ports:
      - "8081:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/state/airflow.db
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RIOT_API_KEY: ${RIOT_API_KEY}
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./airflow/state:/opt/airflow/state
      - ./airflow/logs:/opt/airflow/logs
      - ./extract:/opt/airflow/project/extract:ro
      - ./transform/dbt:/opt/airflow/project/dbt
    depends_on:
      db:
        condition: service_healthy
